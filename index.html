<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalCare - Agendamento Odontológico</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glow-purple {
            box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.35), 0 8px 10px -6px rgba(147, 51, 234, 0.35);
        }
        .glow-sm {
            box-shadow: 0 4px 15px -3px rgba(147, 51, 234, 0.2);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-900 to-gray-900 flex justify-center items-center min-h-screen p-2">

    <div class="w-full max-w-md h-[850px] bg-white shadow-2xl rounded-3xl flex flex-col relative overflow-hidden border-4 border-purple-500/30 glow-purple">
        
        <div id="app-container" class="flex-1 overflow-y-auto pb-24 no-scrollbar">
            <!-- As telas serão injetadas aqui via JavaScript -->
        </div>

        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-purple-100 flex justify-around items-center py-3 px-2 shadow-lg z-50">
            <button onclick="navigateTo('home')" class="nav-btn text-purple-600 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="home">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Início</span>
            </button>
            <button onclick="navigateTo('appointments')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="appointments">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Consultas</span>
            </button>
            <button onclick="navigateTo('chat')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="chat">
                <i class="fa-solid fa-comments text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Chat</span>
            </button>
            <button onclick="navigateTo('settings')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="settings">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Ajustes</span>
            </button>
        </nav>
    </div>

    <script>
        const specialties = [
            { name: "Ortodontia", count: "05 dentistas", icon: "fa-teeth", cardBg: "bg-purple-50", iconBg: "bg-purple-200", text: "text-purple-700" },
            { name: "Estética Dental", count: "03 dentistas", icon: "fa-face-smile", cardBg: "bg-indigo-50", iconBg: "bg-indigo-200", text: "text-indigo-700" },
            { name: "Limpeza", count: "08 dentistas", icon: "fa-wand-magic-sparkles", cardBg: "bg-blue-50", iconBg: "bg-blue-200", text: "text-blue-700" },
            { name: "Implante", count: "04 dentistas", icon: "fa-tooth", cardBg: "bg-pink-50", iconBg: "bg-pink-200", text: "text-pink-700" },
            { name: "Endodontia", count: "02 dentistas", icon: "fa-stethoscope", cardBg: "bg-violet-50", iconBg: "bg-violet-200", text: "text-violet-700" }
        ];

        const dentists = [
            { id: 1, name: "Dra. Mirna Liz", specialty: "Ortodontia", clinic: "Sorriso Perfeito Clinic", location: "Goiás, Brasil", rating: 4.9, time: "09:00 - 17:00", image: "dentista.jpg" },
            { id: 2, name: "Dra. Ana Souza", specialty: "Implantes Dentários", clinic: "Dental Health Center", location: "São Paulo, Brasil", rating: 4.8, time: "10:00 - 18:00", image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200" },
            { id: 3, name: "Dr. Marcos Lima", specialty: "Endodontia (Canal)", clinic: "Odonto Prime", location: "Rio de Janeiro, Brasil", rating: 4.7, time: "08:00 - 16:00", image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=200" }
        ];

        let myAppointments = [
            { id: 1, doctor: "Dra. Mirna Liz", specialty: "Ortodontia", date: "17 de Maio, 2023", time: "10:30 AM", type: "Messaging", image: "dentista.jpg", status: "Confirmado" },
            { id: 2, doctor: "Dr. Marcos Lima", specialty: "Endodontia", date: "20 de Maio, 2023", time: "02:00 PM", type: "Voice call", image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=200", status: "Pendente" }
        ];

        let chatConversations = [
            { id: 1, name: "Dra. Mirna Liz", lastMessage: "Olá Cibele, confirme o seu horário por favor.", time: "10:42", unread: 2, image: "dentista.jpg" },
            { id: 2, name: "Dra. Ana Souza", lastMessage: "Combinado então para quinta-feira!", time: "Ontem", unread: 0, image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200" },
            { id: 3, name: "Dr. Marcos Lima", lastMessage: "Obrigado pela preferência, bom sorriso!", time: "12/05", unread: 0, image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=200" }
        ];

        let selectedDoctor = dentists[0];
        let selectedTime = "10:30 AM";
        let selectedFee = "Messaging ($5)";

        window.onload = () => {
            navigateTo('welcome');
        };

        function navigateTo(screen, param = null) {
            const container = document.getElementById('app-container');
            const bottomNav = document.getElementById('bottom-nav');
            container.scrollTop = 0;

            if (screen === 'welcome') {
                bottomNav.classList.add('hidden');
                container.classList.remove('pb-24');
                container.classList.add('pb-4');
            } else {
                bottomNav.classList.remove('hidden');
                container.classList.add('pb-24');
                container.classList.remove('pb-4');
                updateNavActiveState(screen);
            }

            switch(screen) {
                case 'welcome': renderWelcomeScreen(container); break;
                case 'home': renderHomeScreen(container); break;
                case 'doctors': renderDoctorsScreen(container); break;
                case 'profile': renderProfileScreen(container, param); break;
                case 'booking': renderBookingScreen(container, param); break;
                case 'appointments': renderAppointmentsScreen(container); break;
                case 'chat': renderChatScreen(container); break;
                case 'settings': renderSettingsScreen(container); break;
                default: renderWelcomeScreen(container);
            }
        }

        function updateNavActiveState(screen) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.getAttribute('data-target');
                if (target === screen) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-purple-600', 'font-bold');
                } else {
                    btn.classList.remove('text-purple-600', 'font-bold');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        function renderWelcomeScreen(container) {
            container.innerHTML = `
                <div class="relative w-full h-full flex flex-col justify-between bg-gradient-to-b from-purple-900 via-purple-950 to-indigo-950 text-white overflow-hidden">
                    <div class="absolute top-6 left-6 z-20">
                        <button onclick="navigateTo('home')" class="w-9 h-9 rounded-full bg-white/25 backdrop-blur-md flex items-center justify-center text-white cursor-pointer hover:bg-white/40 transition">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                    </div>
                    <div class="relative w-full flex-1 flex items-end justify-center overflow-hidden">
                        <img src="tela.jpg" alt="Profissional Destaque" class="w-full h-full object-cover object-top opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#2e1065] via-[#2e1065]/40 to-transparent"></div>
                    </div>
                    <div class="px-8 pb-10 pt-4 text-center z-10 bg-[#2e1065]">

                        <p class="text-xs text-purple-200 leading-relaxed mb-6 max-w-xs mx-auto">
                            Proteção precoce para você e sua família crescerem com saúde
                        </p>
                        <button onclick="navigateTo('home')" class="w-full bg-white text-purple-900 font-bold text-xs py-4 rounded-2xl shadow-xl hover:bg-purple-50 transition transform active:scale-95 cursor-pointer">
                            Começar
                        </button>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen(container) {
            container.innerHTML = `

                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Cibele" class="w-12 h-12 rounded-full object-cover border-2 border-purple-500 shadow-md">

                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <div onclick="navigateTo('welcome')" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 cursor-pointer hover:bg-purple-100 hover:text-purple-600 transition shadow-sm">
                                <i class="fa-regular fa-bell text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <h1 class="text-2xl font-extrabold text-gray-900 leading-tight">Vamos encontrar<br>seu dentista ideal</h1>
                    </div>

                    <div class="mb-6">
                        <div class="flex space-x-3 overflow-x-auto no-scrollbar py-2">
                            ${specialties.map(spec => `
                                <div onclick="navigateTo('doctors')" class="min-w-[125px] ${spec.cardBg} p-4 rounded-2xl border border-purple-100 shadow-sm flex flex-col justify-between cursor-pointer hover:shadow-md transition flex-shrink-0">
                                    <div class="w-10 h-10 rounded-xl ${spec.iconBg} ${spec.text} flex items-center justify-center mb-3">
                                        <i class="fa-solid ${spec.icon} text-lg"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-gray-800 text-xs">${spec.name}</h4>
                                        <p class="text-[10px] text-gray-500 mt-0.5">${spec.count}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="font-bold text-gray-800 text-sm">Dentistas em Destaque</h4>
                            <span onclick="navigateTo('doctors')" class="text-xs text-purple-600 font-semibold cursor-pointer hover:underline">Ver tudo</span>
                        </div>
                        <div class="space-y-4">
                            ${dentists.map((d, index) => `
                                <div onclick="navigateTo('profile', ${index})" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-purple-300 hover:glow-sm transition">
                                    <img src="${d.image}" alt="${d.name}" class="w-24 h-24 rounded-2xl object-cover shadow-md flex-shrink-0">
                                    <div class="flex-1">
                                        <h5 class="text-sm font-bold text-gray-800">${d.name}</h5>
                                        <p class="text-xs text-purple-600 font-semibold mt-1">${d.specialty}</p>
                                        <p class="text-[11px] text-gray-400 mt-0.5">${d.clinic}</p>
                                        <div class="flex items-center text-[10px] text-purple-700 font-medium mt-2 bg-purple-50 px-2 py-1 rounded-lg w-max">
                                            <i class="fa-regular fa-clock mr-1.5"></i> ${d.time}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDoctorsScreen(container) {
            container.innerHTML = `
                <div class="p-6">
                    <h3 class="font-extrabold text-gray-900 text-lg mb-4">Dentistas Disponíveis</h3>
                    <div class="space-y-4">
                        ${dentists.map((d, index) => `
                            <div onclick="navigateTo('profile', ${index})" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-purple-300 transition">
                                <img src="${d.image}" alt="${d.name}" class="w-20 h-20 rounded-2xl object-cover shadow-md flex-shrink-0">
                                <div class="flex-1">
                                    <h5 class="text-sm font-bold text-gray-800">${d.name}</h5>
                                    <p class="text-xs text-purple-600 font-semibold mt-0.5">${d.specialty}</p>
                                    <p class="text-[11px] text-gray-400 mt-0.5">${d.clinic}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfileScreen(container, docIndex = 0) {
            const doc = dentists[docIndex !== null ? docIndex : 0];
            selectedDoctor = doc;

            container.innerHTML = `

                    <div class="flex items-center space-x-4 mb-6">
                        <button onclick="navigateTo('home')" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 cursor-pointer hover:bg-gray-200 transition">

                    </div>

                    <div class="flex items-center space-x-4 mb-6">
                        <img src="${doc.image}" alt="${doc.name}" class="w-28 h-28 rounded-2xl object-cover shadow-md flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-base font-extrabold text-gray-900 truncate">${doc.name}</h3>
                            <p class="text-xs text-gray-400 font-medium mt-0.5">${doc.specialty}</p>
                            <h4 class="text-xs font-bold text-gray-800 mt-2">${doc.clinic}</h4>
                            <p class="text-[11px] text-gray-400">${doc.location}</p>
                        </div>
                    </div>

                        <div class="flex-1 text-center pb-2 text-gray-400 font-medium text-xs cursor-pointer">Review</div>
                        <div class="flex-1 text-center pb-2 text-gray-400 font-medium text-xs cursor-pointer">Rating</div>
                    </div>

                    <div class="mb-6">
                        <p class="text-xs text-gray-500 leading-relaxed">
                            ${doc.name} is the greatest Dental Specialist since 2002 at ${doc.clinic}. He has achieved several awards for his wonderful contribution in his own field.... <span class="text-purple-600 font-semibold cursor-pointer">More</span>
                        </p>

                        <div class="absolute inset-0 opacity-80 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&q=80&w=500')"></div>
                        <div class="absolute inset-0 bg-white/30 backdrop-blur-[1px]"></div>
                        <div class="absolute bg-white/90 px-3 py-1.5 rounded-xl shadow-md flex items-center space-x-2 border border-purple-200">
                            <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                            <span class="text-[11px] font-bold text-gray-800">${doc.clinic}</span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="text-xs font-extrabold text-gray-900 mb-1">Working time</h4>

                    </div>
                </div>

                <div class="absolute bottom-16 left-0 right-0 px-6 bg-gradient-to-t from-white via-white/90 to-transparent pt-4 pb-2 z-40">
                    <button onclick="navigateTo('booking')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-4 rounded-2xl shadow-lg transition transform active:scale-95 cursor-pointer">

        // TELA DE AGENDAMENTO (APPOINTMENT) IDÊNTICA À SUA IMAGEM

                    <!-- Topo: Voltar e Título -->
                    <div class="flex items-center space-x-4 mb-6">
                        <button onclick="navigateTo('profile')" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 cursor-pointer hover:bg-gray-200 transition">

                    </div>

                    <!-- Data -->
                    <h3 class="text-base font-extrabold text-gray-900 mb-4">17 May 2023</h3>

                    <!-- Seletor Morning / Evening -->
                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div class="bg-purple-600 text-white p-3.5 rounded-2xl flex items-center space-x-3 shadow-md cursor-pointer">

                        <div class="bg-white border border-gray-200 text-gray-700 py-3 rounded-xl text-center text-[11px] font-semibold shadow-sm cursor-pointer hover:border-purple-400">10:00 AM</div>
                        <div class="bg-purple-600 text-white py-3 rounded-xl text-center text-[11px] font-bold shadow-md cursor-pointer">10:30 AM</div>
                        <div class="bg-white border border-gray-200 text-gray-700 py-3 rounded-xl text-center text-[11px] font-semibold shadow-sm cursor-pointer hover:border-purple-400">11:00 AM</div>
                        <div class="bg-white border border-gray-200 text-gray-700 py-3 rounded-xl text-center text-[11px] font-semibold shadow-sm cursor-pointer hover:border-purple-400">11:30 AM</div>

                    </button>
                </div>
            `;
        }

        function confirmBooking() {
            // Adiciona na lista de consultas da Cibele
            myAppointments.unshift({
                id: Date.now(),
                doctor: selectedDoctor.name,
                specialty: selectedDoctor.specialty,
                date: "17 de Maio, 2023",
                time: selectedTime,
                type: "Messaging",
                image: selectedDoctor.image,
                status: "Confirmado"
            });
            navigateTo('appointments');
        }

        function renderAppointmentsScreen(container) {
            container.innerHTML = `

                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
