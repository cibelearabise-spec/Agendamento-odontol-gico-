<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalCare - Agendamento Odontológico</title>
    <!-- Tailwind CSS via CDN Corrigido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glow-purple {
            box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.35), 0 8px 10px -6px rgba(147, 51, 234, 0.35);
        }
        .glow-sm {
            box-shadow: 0 4px 15px -3px rgba(147, 51, 234, 0.2);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-900 to-gray-900 flex justify-center items-center min-h-screen p-2">

    <div class="w-full max-w-md h-[850px] bg-white shadow-2xl rounded-3xl flex flex-col relative overflow-hidden border-4 border-purple-500/30 glow-purple">
        
        <div id="app-container" class="flex-1 overflow-y-auto pb-20 no-scrollbar">
            <!-- As telas serão injetadas aqui via JavaScript -->
        </div>

        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-purple-100 flex justify-around items-center py-3 px-2 shadow-lg z-50">
            <button onclick="navigateTo('home')" class="nav-btn text-purple-600 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="home">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Início</span>
            </button>
            <button onclick="navigateTo('appointments')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="appointments">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Consultas</span>
            </button>
            <button onclick="navigateTo('chat')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="chat">
                <i class="fa-solid fa-comments text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Chat</span>
            </button>
            <button onclick="navigateTo('settings')" class="nav-btn text-gray-400 flex flex-col items-center cursor-pointer transition transform hover:scale-110" data-target="settings">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Ajustes</span>
            </button>
        </nav>
    </div>

    <script>
        const dentists = [
            { id: 1, name: "Dra. Mirna Liz", specialty: "Ortodontia", clinic: "Sorriso Perfeito Clinic", rating: 4.9, time: "09:00 AM - 05:00 PM", image: "dentista.jpg" },
            { id: 2, name: "Dra. Ana Souza", specialty: "Implantes Dentários", clinic: "Dental Health Center", rating: 4.8, time: "10:00 AM - 06:00 PM", image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200" },
            { id: 3, name: "Dr. Marcos Lima", specialty: "Endodontia (Canal)", clinic: "Odonto Prime", rating: 4.7, time: "08:00 AM - 04:00 PM", image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=200" }
        ];

        let selectedDentist = null;
        let selectedDate = '17 May 2023';
        let selectedTimeSlot = '10:30 AM';
        let selectedServiceType = 'Consulta presencial';
        let selectedServicePrice = 50;

        window.onload = () => {
            navigateTo('welcome');
        };

        function navigateTo(screen, param = null) {
            const container = document.getElementById('app-container');
            const bottomNav = document.getElementById('bottom-nav');
            container.scrollTop = 0;

            if (screen === 'welcome') {
                bottomNav.classList.add('hidden');
                container.classList.remove('pb-20');
                container.classList.add('pb-4');
            } else {
                bottomNav.classList.remove('hidden');
                container.classList.add('pb-20');
                container.classList.remove('pb-4');
                updateNavActiveState(screen);
            }

            switch(screen) {
                case 'welcome': renderWelcomeScreen(container); break;
                case 'home': renderHomeScreen(container); break;
                case 'doctors': renderDoctorsScreen(container); break;
                case 'profile':
                    selectedDentist = dentists.find(d => d.id === param) || dentists[0];
                    renderProfileScreen(container);
                    break;
                case 'booking': renderBookingScreen(container); break;
                case 'appointments': renderAppointmentsScreen(container); break;
                case 'chat': renderChatScreen(container); break;
                case 'settings': renderSettingsScreen(container); break;
                default: renderWelcomeScreen(container);
            }
        }

        function updateNavActiveState(screen) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.getAttribute('data-target');
                if (target === screen) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-purple-600', 'font-bold');
                } else {
                    btn.classList.remove('text-purple-600', 'font-bold');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        function renderWelcomeScreen(container) {
            container.innerHTML = `
                <div class="relative w-full h-full flex flex-col justify-between bg-gradient-to-b from-purple-900 via-purple-950 to-indigo-950 text-white overflow-hidden">
                    <div class="absolute top-6 left-6 z-20">
                        <button onclick="navigateTo('home')" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white cursor-pointer hover:bg-white/30 transition">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                    </div>
                    <div class="relative w-full flex-1 flex items-end justify-center overflow-hidden">
                        <img src="tela.jpg" alt="Profissional Destaque" class="w-full h-full object-cover object-top opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#2e1065] via-[#2e1065]/40 to-transparent"></div>
                    </div>
                    <div class="px-8 pb-10 pt-4 text-center z-10 bg-[#2e1065]">
                        <h1 class="text-2xl font-extrabold tracking-tight mb-2 text-white">Ponto de Saúde</h1>
                        <p class="text-xs text-purple-200 leading-relaxed mb-6 max-w-xs mx-auto">
                            Proteção precoce para você e sua família crescerem com saúde
                        </p>
                        <button onclick="navigateTo('home')" class="w-full bg-white text-purple-900 font-bold text-xs py-4 rounded-2xl shadow-xl hover:bg-purple-50 transition transform active:scale-95 cursor-pointer">
                            Começar
                        </button>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen(container) {
            container.innerHTML = `
                <div class="p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <p class="text-xs text-gray-400">Bem-vindo(a) de volta,</p>
                            <h2 class="text-lg font-extrabold text-gray-800">Cibele Arabise</h2>
                        </div>
                        <div onclick="navigateTo('welcome')" title="Ver tela inicial" class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold border border-purple-200 glow-sm cursor-pointer hover:bg-purple-200 transition">
                            C
                        </div>
                    </div>
                    <div class="bg-gradient-to-r from-purple-600 via-purple-700 to-indigo-600 rounded-2xl p-5 text-white mb-6 glow-purple relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 w-28 h-28 bg-white/10 rounded-full blur-xl"></div>
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <h3 class="text-lg font-bold">Sorriso Saudável</h3>
                                <p class="text-xs text-purple-100 mt-1">Cuide da sua saúde bucal regularmente com os melhores especialistas.</p>
                                <button onclick="navigateTo('doctors')" class="mt-4 bg-white text-purple-700 text-xs font-bold px-4 py-2.5 rounded-xl shadow-md cursor-pointer hover:bg-purple-50 transition transform hover:scale-105">
                                    Agendar Agora
                                </button>
                            </div>
                            <i class="fa-solid fa-tooth text-5xl text-purple-200 opacity-90"></i>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="font-bold text-gray-800 text-sm">Dentistas em Destaque</h4>
                            <span onclick="navigateTo('doctors')" class="text-xs text-purple-600 font-semibold cursor-pointer hover:underline">Ver mais</span>
                        </div>
                        <div class="space-y-4">
                            ${dentists.map(d => `
                                <div onclick="navigateTo('profile', ${d.id})" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-purple-300 hover:glow-sm transition">
                                    <!-- Foto bem maior (w-24 h-24) -->
                                    <img src="${d.image}" alt="${d.name}" class="w-24 h-24 rounded-2xl object-cover shadow-md flex-shrink-0">
                                    <div class="flex-1">
                                        <h5 class="text-sm font-bold text-gray-800">${d.name}</h5>
                                        <p class="text-xs text-purple-600 font-semibold mt-1">${d.specialty}</p>
                                        <p class="text-[11px] text-gray-400 mt-1">${d.clinic}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDoctorsScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Dentistas Disponíveis</h3><button onclick="navigateTo('home')" class="text-purple-600 text-xs underline">Voltar para Home</button></div>`;
        }

        function renderProfileScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Perfil</h3><button onclick="navigateTo('doctors')" class="text-purple-600 text-xs underline">Voltar</button></div>`;
        }

        function renderBookingScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Agendamento</h3></div>`;
        }

        let myAppointments = [];
        function renderAppointmentsScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Meus Agendamentos</h3></div>`;
        }

        function renderChatScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Chat</h3></div>`;
        }

        function renderSettingsScreen(container) {
            container.innerHTML = `<div class="p-6"><h3 class="font-bold text-gray-800 mb-4">Configurações</h3></div>`;
        }
    </script>
</body>
</html>
